name: CI

on: [push, pull_request]

jobs:
  sqlite:
    name: Test SQLite and build examples
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: stable

    - name: Install Atlas
      shell: bash
      env:
        ATLAS_INSTALL_DIR: ${{ runner.temp }}/atlas/bin
      run: |
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash
        echo "$ATLAS_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-examples-${{ runner.os }}-${{ hashFiles('ormin.nimble') }}

    - name: Install dependencies
      run: atlas install -uk --feature:examples

    - name: Run test sqlite
      run: nim test

    - name: Build examples
      run: nim buildexamples

  postgres:
    name: Test PostgreSQL 14
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_ormin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      
    - name: Setup nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: stable

    - name: Install Atlas
      shell: bash
      env:
        ATLAS_INSTALL_DIR: ${{ runner.temp }}/atlas/bin
      run: |
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash
        echo "$ATLAS_INSTALL_DIR" >> "$GITHUB_PATH"

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps/
        key: atlas-postgres-${{ runner.os }}-${{ hashFiles('ormin.nimble') }}

    - name: Install dependencies
      run: atlas install -uk

    - name: Run test postgres
      run: nim test_postgres
      env:
        PGPASSWORD: test

  mysql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - server: mysql:8.4
            client: default-libmysqlclient-dev
            health: mysqladmin ping -h 127.0.0.1 -ptest
          - server: mariadb:11.4
            client: libmariadb-dev-compat
            health: mariadb-admin ping -h 127.0.0.1 -ptest
    name: Test ${{ matrix.server }}
    services:
      mysql:
        image: ${{ matrix.server }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: ormin_test
          MYSQL_USER: ormin_test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
      - name: Install client development headers
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.client }}
      - name: Install Nim dependencies
        run: nimble install -y --depsOnly
      - name: Run MySQL/MariaDB tests
        run: nim test_mysql
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: ormin_test
          MYSQL_USER: ormin_test
          MYSQL_PASSWORD: test
